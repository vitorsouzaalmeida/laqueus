<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laqueus</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <strong id="project-name">Laqueus</strong>
      </div>
      <div class="segmented" role="tablist" aria-label="View">
        <button id="tab-map" role="tab" class="active" aria-selected="true">Map</button>
        <button id="tab-routes" role="tab" aria-selected="false">Routes</button>
        <button id="tab-functions" role="tab" aria-selected="false" disabled>Functions</button>
      </div>
      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Search files, areas, routes, functions ( / )"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search"
        />
        <ul id="search-results" class="search-results" hidden></ul>
      </div>
      <span class="control-group" data-tabs="map">
        <select id="grouping" aria-label="Grouping">
          <option value="areas">Group by imports</option>
          <option value="folders">Group by folders</option>
        </select>
        <span class="tray">
          Show
          <label class="chip-toggle"><input type="checkbox" data-tray="tooling" /> Tooling</label>
          <label class="chip-toggle"><input type="checkbox" data-tray="unreached" /> Not reached</label>
        </span>
      </span>
      <select id="color" aria-label="Color" data-tabs="map routes">
        <option value="side">Color by side</option>
        <option value="complexity">Color by complexity</option>
      </select>
      <label class="toggle" data-tabs="functions"><input id="focus" type="checkbox" disabled /> Focus selection</label>
      <select id="layout" aria-label="Layout" data-tabs="functions"></select>
      <button id="fit">Fit</button>
      <button id="rescan">Rescan</button>
      <button id="warnings" class="warnings" aria-expanded="false">0 warnings</button>
    </header>
    <main>
      <section class="stage">
        <div id="crumbs" class="crumbs"></div>
        <div id="map-graph" class="graph"></div>
        <div id="routes-graph" class="graph" hidden></div>
        <div id="functions-graph" class="graph" hidden></div>
        <div id="logic-graph" class="graph" hidden></div>
        <div id="empty" class="empty" hidden></div>
        <div id="legend" class="legend"></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </section>
      <aside id="details" class="details"></aside>
    </main>
    <section id="diagnostics" class="diagnostics" hidden>
      <header>
        <strong>Warnings</strong>
        <button id="close-diagnostics" aria-label="Close warnings">×</button>
      </header>
      <ul id="diagnostics-list"></ul>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
